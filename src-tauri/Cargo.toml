[package]
name = "fumi-app"
version = "0.1.0"
description = "Fumi - A fast, lightweight email client"
authors = ["atani"]
edition = "2021"

[lib]
name = "fumi_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-http = "2"
tauri-plugin-notification = "2"
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tiny_http = "0.12"
url = "2"
rand = "0.8"
sha2 = "0.10"
base64 = "0.22"
